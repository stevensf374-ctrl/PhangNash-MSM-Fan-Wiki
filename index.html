<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Singing Monsters Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>🎶 My Singing Monsters Wiki</h1>
  <nav>
    <a href="monsters.html">Monsters</a>
    <a href="islands.html">Islands</a>
    <a href="lore.html">Lore</a>
    <a href="#" id="adminToggle">Editor Mode</a>
  </nav>
</header>

<main>
  <form id="searchForm" action="search.html">
    <input id="search" name="q" placeholder="Search monsters, islands, lore…" />
  </form>

  <section class="card-grid" id="featured"></section>
</main>

<footer>Fan project · Not affiliated with Big Blue Bubble</footer>

<script src="data.js"></script>
<script src="search.js"></script>
<script>
  const ADMIN_PASSWORD = 'W1&iiPh@NGlaah';
  const adminToggle = document.getElementById('adminToggle');

  function isAdmin() {
    return localStorage.getItem('msm_admin') === 'true';
  }

  function enableAdmin() {
    document.body.classList.add('admin');
    document.querySelectorAll('[data-editable]').forEach(el => {
      el.contentEditable = true;
      el.classList.add('editable');
    });
  }

  function disableAdmin() {
    document.body.classList.remove('admin');
    document.querySelectorAll('[data-editable]').forEach(el => {
      el.contentEditable = false;
      el.classList.remove('editable');
    });
  }

  adminToggle.addEventListener('click', e => {
    e.preventDefault();
    if (!isAdmin()) {
      const pass = prompt('Enter admin password');
      if (pass === ADMIN_PASSWORD) {
        localStorage.setItem('msm_admin','true');
        enableAdmin();
        alert('Editor Mode enabled');
      } else {
        alert('Incorrect password');
      }
    } else {
      localStorage.removeItem('msm_admin');
      disableAdmin();
      alert('Editor Mode disabled');
    }
  });

  if (isAdmin()) enableAdmin();
</script>
</body>
</html>
